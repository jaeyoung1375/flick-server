services:
  backend:
    build: /home/ubuntu/flick-server        # backend/Dockerfile 위치
    container_name: backend
    restart: always
    env_file:
      - ../.env
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 9090
    ports:
      - "9090:9090"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"     # 외부(DBeaver)에서 접속 안 할 거면 이 줄 삭제 가능
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    ports:
      - "6379:6379"     # 외부에서 접속 안 할 거면 이 줄 삭제 가능
    volumes:
      - redisdata:/data

volumes:
  pgdata:
    name: postgres_pgdata
  redisdata: